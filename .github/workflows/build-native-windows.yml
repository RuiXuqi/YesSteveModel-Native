name: Build Native Windows x64

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake build type
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==2.29.1"

          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
          }

          cmake --version
          ninja --version
          conan --version
          nasm -version

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: conan/cache
          key: conan-windows-x64-${{ env.BUILD_TYPE }}-${{ hashFiles('**/conanfile.py') }}
          restore-keys: |
            conan-windows-x64-${{ env.BUILD_TYPE }}-
            conan-windows-x64-

      - name: Index dependency recipes
        shell: cmd
        run: .\bootstrap.cmd setup

      - name: Build ysm-lib
        shell: pwsh
        run: |
          if ($env:BUILD_TYPE -eq 'Debug') {
            & .\bootstrap.cmd build native --debug
          } else {
            & .\bootstrap.cmd build native
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect native library
        shell: pwsh
        run: |
          $libraries = @(Get-ChildItem -Path build -Recurse -File -Filter 'ysm.dll')
          if ($libraries.Count -ne 1) {
            Write-Error "Expected exactly one ysm.dll, found $($libraries.Count)."
            Get-ChildItem -Path build -Recurse -File | Select-Object FullName
            exit 1
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $libraries[0].FullName artifact\ysm.dll

          $pdb = Get-ChildItem -Path build -Recurse -File -Filter 'ysm.pdb' | Select-Object -First 1
          if ($null -ne $pdb) {
            Copy-Item $pdb.FullName artifact\ysm.pdb
          }

          $hash = Get-FileHash artifact\ysm.dll -Algorithm SHA256
          "build_type=$env:BUILD_TYPE" | Set-Content artifact\BUILD.txt
          "source=$($libraries[0].FullName)" | Add-Content artifact\BUILD.txt
          "$($hash.Algorithm)=$($hash.Hash)" | Add-Content artifact\BUILD.txt

          Get-ChildItem artifact | Select-Object Name, Length
          Get-Content artifact\BUILD.txt

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: ysm-native-windows-x64-${{ env.BUILD_TYPE }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
